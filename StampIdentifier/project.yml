name: StampIdentifier
options:
  bundleIdPrefix: com.example.stampidentifier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StampIdentifier:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StampIdentifier
    info:
      path: StampIdentifier/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "Stamp Identifier uses the camera to scan and identify your stamps."
        NSPhotoLibraryUsageDescription: "Stamp Identifier needs access to your photo library to identify stamp images you select."
        UILaunchScreen:
          UIColorName: BrandCream
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stampidentifier
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"

name: NoteHiveAI
options:
  bundleIdPrefix: ai.notehive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NoteHiveAI:
    type: application
    platform: iOS
    sources:
      - path: NoteHiveAI
        excludes:
          - "Info.plist"
    resources:
      - NoteHiveAI/Resources/Assets.xcassets
      - NoteHiveAI/Preview Content
    info:
      path: NoteHiveAI/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.notehive.app
        INFOPLIST_FILE: NoteHiveAI/Info.plist
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_ASSET_PATHS: "\"NoteHiveAI/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
